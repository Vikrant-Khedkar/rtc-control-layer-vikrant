services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rtc_local_owner
      POSTGRES_DB: rtc_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rtc-postgres:/var/lib/postgresql/data
      - ./db/local-role.sql:/docker-entrypoint-initdb.d/001-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rtc_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  rtc-postgres:
