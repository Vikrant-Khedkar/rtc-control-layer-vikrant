chestration. Approved quote → job · allowed transitions</title><rect class="node" x="840" y="395" width="350" height="75" rx="10"/><text x="1015.0" y="427" class="t" text-anchor="middle">Shipment / job orchestration</text><text x="1015.0" y="450" class="small" text-anchor="middle">Approved quote → job · allowed transitions</text></g><g id="intake-quote"><title>intake-quote</title><path class="edge " d="M400 432 H445"/></g><g id="quote-job"><title>quote-job</title><path class="edge " d="M795 432 H840"/></g><g id="milestones-module"><title>Milestones, status events &amp; SLA. Stage · owner · next action · deadline status</title><rect class="node" x="50" y="515" width="350" height="75" rx="10"/><text x="225.0" y="547" class="t" text-anchor="middle">Milestones, status events &amp; SLA</text><text x="225.0" y="570" class="small" text-anchor="middle">Stage · owner · next action · deadline status</text></g><g id="exception-module"><title>Exception management. Raise · assign · resolve · record recovery</title><rect class="node warn" x="445" y="604" width="350" height="75" rx="10"/><text x="620.0" y="636" class="t" text-anchor="middle">Exception management</text><text x="620.0" y="659" class="small" text-anchor="middle">Raise · assign · resolve · record recovery</text></g><g id="billing-module"><title>Billing &amp; closure. Readiness conditions · Accounts closure</title><rect class="node" x="840" y="515" width="350" height="75" rx="10"/><text x="1015.0" y="547" class="t" text-anchor="middle">Billing &amp; closure</text><text x="1015.0" y="570" class="small" text-anchor="middle">Readiness conditions · Accounts closure</text></g><g id="job-milestones"><title>job-milestones</title><path class="edge " d="M1015 470 V490 H225 V515"/></g><g id="milestones-billing"><title>Evaluate billing readiness</title><path class="edge " d="M400 552 H840"/><text x="620" y="538" class="small" text-anchor="middle">Evaluate billing readiness</text></g><g id="milestone-exception"><title>If an issue 