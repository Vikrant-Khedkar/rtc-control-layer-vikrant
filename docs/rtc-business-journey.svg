<svg id="diagram-business" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1210" role="img" aria-label="Business journey: how work moves through the application"><title>Business journey: how work moves through the application</title><style>.node{fill:var(--paper,#fff);stroke:var(--line,#d8dcd6);stroke-width:1.5}.accent{fill:var(--rose,#faedef);stroke:var(--red,#a82130)}.warn{fill:var(--sand,#fff5e6);stroke:var(--amber,#b88332)}.done{fill:var(--greenbg,#edf5ef);stroke:var(--green,#4a795a)}.boundary{fill:var(--soft,#f7f7f3);stroke:var(--line,#d8dcd6);stroke-width:1.5}.future{stroke-dasharray:7 5}.edge{fill:none;stroke:var(--ink,#4a514b);stroke-width:1.5;}.dashed{stroke-dasharray:6 5}.t{font:600 16px Arial,sans-serif;fill:var(--ink,#333b34)}.small{font:13px Arial,sans-serif;fill:var(--muted,#737b72)}.tag{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:var(--red,#a82130)}.group{font:700 14px Arial,sans-serif;fill:var(--ink,#333b34)}#diagram-business .edge{marker-end:url(#business-arrow)}</style><defs><marker id="business-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#737b72"/></marker></defs><text x="620" y="28" class="small" text-anchor="middle">Follow the main path down. The side branches show what happens when work needs attention.</text><g id="business-enquiry"><title>1. An enquiry comes in. Operations enters or imports the customer request</title><rect class="node" x="325" y="55" width="490" height="90" rx="10"/><text x="343" y="77" class="tag" text-anchor="start">OPERATIONS</text><text x="570.0" y="101" class="t" text-anchor="middle">1. An enquiry comes in</text><text x="570.0" y="123" class="small" text-anchor="middle">Operations enters or imports the customer request</text></g><g id="business-enquiry-check"><title>business-enquiry-check</title><path class="edge " d="M570 145 V175"/></g><g id="business-complete"><title>2. Check the information. Are the required details complete and valid?</title><rect class="node" x="325" y="175" width="490" height="90" rx="10"/><text x="343" y="197" class="tag" text-anchor="start">OPERATIONS</text><text x="570.0" y="221" class="t" text-anchor="middle">2. Check the information</text><text x="570.0" y="243" class="small" text-anchor="middle">Are the required details complete and valid?</text></g><g id="business-missing"><title>Missing details</title><path class="edge " d="M815 220 H875"/><text x="1040" y="158" class="small" text-anchor="middle">Missing details</text></g><g id="business-review"><title>Needs Review. Operations fills in or corrects the details</title><rect class="node warn" x="875" y="175" width="330" height="90" rx="10"/><text x="1040.0" y="207" class="t" text-anchor="middle">Needs Review</text><text x="1040.0" y="230" class="small" text-anchor="middle">Operations fills in or corrects the details</text></g><g id="business-corrected"><title>Return for another check</title><path class="edge " d="M1040 265 V290 H850 V245 H815"/><text x="1032" y="310" class="small" text-anchor="middle">Return for another check</text></g><g id="business-valid"><title>Complete</title><path class="edge " d="M570 265 V315"/><text x="621" y="296" class="small" text-anchor="middle">Complete</text></g><g id="business-quote"><title>3. Prepare an internal draft quote. Select an example rate and apply the set margin</title><rect class="node" x="325" y="315" width="490" height="90" rx="10"/><text x="343" y="337" class="tag" text-anchor="start">OPERATIONS</text><text x="570.0" y="361" class="t" text-anchor="middle">3. Prepare an internal draft quote</text><text x="570.0" y="383" class="small" text-anchor="middle">Select an example rate and apply the set margin</text></g><g id="business-submit"><title>business-submit</title><path class="edge " d="M570 405 V445"/></g><g id="business-approval"><title>4. Manager reviews and approves. It remains a draft until the Manager approves</title><rect class="node accent" x="325" y="445" width="490" height="90" rx="10"/><text x="343" y="467" class="tag" text-anchor="start">MANAGER</text><text x="570.0" y="491" class="t" text-anchor="middle">4. Manager reviews and approves</text><text x="570.0" y="513" class="small" text-anchor="middle">It remains a draft until the Manager approves</text></g><text x="1040" y="477" class="t" text-anchor="middle">Internal quote only</text><text x="1040" y="500" class="small" text-anchor="middle">Quotes stay inside the assessment.</text><g id="business-approved"><title>Approved</title><path class="edge " d="M570 535 V580"/><text x="618" y="563" class="small" text-anchor="middle">Approved</text></g><g id="business-job"><title>5. Open the job and move it forward. An owner progresses the agreed operational stages</title><rect class="node" x="325" y="580" width="490" height="90" rx="10"/><text x="343" y="602" class="tag" text-anchor="start">OPERATIONS</text><text x="570.0" y="626" class="t" text-anchor="middle">5. Open the job and move it forward</text><text x="570.0" y="648" class="small" text-anchor="middle">An owner progresses the agreed operational stages</text></g><g id="business-problem"><title>Problem arises</title><path class="edge " d="M815 620 H875"/><text x="1040" y="551" class="small" text-anchor="middle">Problem arises</text></g><g id="business-problem-owner"><title>Raise and assign the issue. Record who owns it and the recovery action</title><rect class="node warn" x="875" y="570" width="330" height="90" rx="10"/><text x="1040.0" y="602" class="t" text-anchor="middle">Raise and assign the issue</text><text x="1040.0" y="625" class="small" text-anchor="middle">Record who owns it and the recovery action</text></g><g id="business-work-on-issue"><title>business-work-on-issue</title><path class="edge " d="M1040 660 V700"/></g><g id="business-recovered"><title>Resolve the issue. Record the outcome and continue the job</title><rect class="node done" x="875" y="700" width="330" height="80" rx="10"/><text x="1040.0" y="732" class="t" text-anchor="middle">Resolve the issue</text><text x="1040.0" y="755" class="small" text-anchor="middle">Record the outcome and continue the job</text></g><g id="business-continue"><title>Back to the job</title><path class="edge " d="M875 740 H850 V650 H815"/><text x="1040" y="804" class="small" text-anchor="middle">Back to the job</text></g><g id="business-finish-work"><title>Required work completed</title><path class="edge " d="M570 670 V725"/><text x="664" y="702" class="small" text-anchor="middle">Required work completed</text></g><g id="business-ready"><title>6. Job becomes billing-ready. Accounts can see that it is ready to close</title><rect class="node done" x="325" y="725" width="490" height="90" rx="10"/><text x="343" y="747" class="tag" text-anchor="start">ACCOUNTS</text><text x="570.0" y="771" class="t" text-anchor="middle">6. Job becomes billing-ready</text><text x="570.0" y="793" class="small" text-anchor="middle">Accounts can see that it is ready to close</text></g><g id="business-close"><title>business-close</title><path class="edge " d="M570 815 V860"/></g><g id="business-closed"><title>7. Accounts marks the job closed. The complete job history remains available</title><rect class="node done" x="325" y="860" width="490" height="90" rx="10"/><text x="343" y="882" class="tag" text-anchor="start">ACCOUNTS</text><text x="570.0" y="906" class="t" text-anchor="middle">7. Accounts marks the job closed</text><text x="570.0" y="928" class="small" text-anchor="middle">The complete job history remains available</text></g><g id="business-visible"><title>God View. Where is each job now?</title><rect class="node accent" x="35" y="320" width="240" height="115" rx="10"/><text x="155.0" y="352" class="t" text-anchor="middle">God View</text><text x="155.0" y="375" class="small" text-anchor="middle">Where is each job now?</text></g><text x="155" y="403" class="small" text-anchor="middle">Owner · next action</text><text x="155" y="423" class="small" text-anchor="middle">Issues · deadlines · billing</text><text x="155" y="477" class="t" text-anchor="middle">Visible throughout</text><text x="155" y="503" class="small" text-anchor="middle">Track work from one place.</text><g id="business-admin"><title>Admin sets the working rules. Roles and permissions · stages · required details · margin · statuses</title><rect class="node accent" x="35" y="1010" width="1170" height="80" rx="10"/><text x="620.0" y="1042" class="t" text-anchor="middle">Admin sets the working rules</text><text x="620.0" y="1065" class="small" text-anchor="middle">Roles and permissions · stages · required details · margin · statuses</text></g><text x="620" y="1132" class="t" text-anchor="middle">Every important change keeps a history: who changed what and when.</text><text x="620" y="1160" class="small" text-anchor="middle">A repeated enquiry is linked or flagged, so it does not create another job.</text></svg>