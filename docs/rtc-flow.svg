<svg id="diagram-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1460" role="img" aria-label="Sea Import Customs assessment workflow"><title>Sea Import Customs assessment workflow</title><style>.node{fill:var(--paper,#fff);stroke:var(--line,#d8dcd6);stroke-width:1.5}.accent{fill:var(--rose,#faedef);stroke:var(--red,#a82130)}.warn{fill:var(--sand,#fff5e6);stroke:var(--amber,#b88332)}.done{fill:var(--greenbg,#edf5ef);stroke:var(--green,#4a795a)}.boundary{fill:var(--soft,#f7f7f3);stroke:var(--line,#d8dcd6);stroke-width:1.5}.future{stroke-dasharray:7 5}.edge{fill:none;stroke:var(--ink,#4a514b);stroke-width:1.5;}.dashed{stroke-dasharray:6 5}.t{font:600 16px Arial,sans-serif;fill:var(--ink,#333b34)}.small{font:13px Arial,sans-serif;fill:var(--muted,#737b72)}.tag{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:var(--red,#a82130)}.group{font:700 14px Arial,sans-serif;fill:var(--ink,#333b34)}#diagram-flow .edge{marker-end:url(#flow-arrow)}</style><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#737b72"/></marker></defs><text x="545" y="26" class="small" text-anchor="middle">Check permissions on the server before each action.</text><g id="permission-check"><title>Is this role allowed?. Check the requested action against role permissions</title><rect class="node accent" x="340" y="45" width="410" height="75" rx="10"/><text x="545.0" y="77" class="t" text-anchor="middle">Is this role allowed?</text><text x="545.0" y="100" class="small" text-anchor="middle">Check the requested action against role permissions</text></g><g id="permission-denied"><title>No</title><path class="edge " d="M750 82 H855"/><text x="802" y="70" class="small" text-anchor="middle">No</text></g><g id="denied"><title>Action denied. Leave the workflow state unchanged</title><rect class="node warn" x="855" y="45" width="340" height="75" rx="10"/><text x="1025.0" y="77" class="t" text-anchor="middle">Action denied</text><text x="1025.0" y="100" class="small" text-anchor="middle">Leave the workflow state unchanged</text></g><g id="permission-allowed"><title>Yes · perform the requested action</title><path class="edge " d="M545 120 V200"/><text x="673" y="155" class="small" text-anchor="middle">Yes · perform the requested action</text></g><g transform="translate(0 150)"><g id="intake"><title>Create / import enquiry. Synthetic Sea Import Customs input</title><rect class="node" x="340" y="50" width="410" height="90" rx="10"/><text x="358" y="72" class="tag" text-anchor="start">OPERATIONS</text><text x="545.0" y="96" class="t" text-anchor="middle">Create / import enquiry</text><text x="545.0" y="118" class="small" text-anchor="middle">Synthetic Sea Import Customs input</text></g><g id="intake-dedupe"><title>intake-dedupe</title><path class="edge " d="M545 140 V170"/></g><g id="dedupe"><title>Check request / import identity. Same input must not create another job</title><rect class="node" x="340" y="170" width="410" height="75" rx="10"/><text x="545.0" y="202" class="t" text-anchor="middle">Check request / import identity</text><text x="545.0" y="225" class="small" text-anchor="middle">Same input must not create another job</text></g><g id="repeat"><title>Repeated input</title><path class="edge " d="M750 207 H855"/><text x="803" y="192" class="small" text-anchor="middle">Repeated input</text></g><g id="existing"><title>Return or link existing record. No second job is created</title><rect class="node done" x="855" y="169" width="340" height="78" rx="10"/><text x="1025.0" y="201" class="t" text-anchor="middle">Return or link existing record</text><text x="1025.0" y="224" class="small" text-anchor="middle">No second job is created</text></g><g id="new-input"><title>New input</title><path class="edge " d="M545 245 V280"/><text x="590" y="269" class="small" text-anchor="middle">New input</text></g><g id="validation"><title>Validate required fields. Use configured fields and validation rules</title><rect class="node" x="340" y="280" width="410" height="75" rx="10"/><text x="545.0" y="312" class="t" text-anchor="middle">Validate required fields</text><text x="545.0" y="335" class="small" text-anchor="middle">Use configured fields and validation rules</text></g><g id="invalid"><title>Invalid</title><path class="edge " d="M750 317 H855"/><text x="805" y="302" class="small" text-anchor="middle">Invalid</text></g><g id="review"><title>Needs Review. Show missing / invalid fields and reason</title><rect class="node warn" x="855" y="280" width="340" height="80" rx="10"/><text x="1025.0" y="312" class="t" text-anchor="middle">Needs Review</text><text x="1025.0" y="335" class="small" text-anchor="middle">Show missing / invalid fields and reason</text></g><g id="correct-review"><title>Operations corrects and retries</title><path class="edge " d="M1025 360 V390 H790 V332 H750"/><text x="991" y="385" class="small" text-anchor="middle">Operations corrects and retries</text></g><g id="valid"><title>Valid</title><path class="edge " d="M545 355 V410"/><text x="578" y="384" class="small" text-anchor="middle">Valid</text></g><g id="rate"><title>Select mock rate + apply margin. Configured margin; illustrative calculation</title><rect class="node" x="340" y="410" width="410" height="75" rx="10"/><text x="545.0" y="442" class="t" text-anchor="middle">Select mock rate + apply margin</text><text x="545.0" y="465" class="small" text-anchor="middle">Configured margin; illustrative calculation</text></g><g id="draft"><title>draft</title><path class="edge " d="M545 485 V515"/></g><g id="quote"><title>Create draft quote. Internal only; never sent externally</title><rect class="node" x="340" y="515" width="410" height="75" rx="10"/><text x="545.0" y="547" class="t" text-anchor="middle">Create draft quote</text><text x="545.0" y="570" class="small" text-anchor="middle">Internal only; never sent externally</text></g><g id="approval"><title>approval</title><path class="edge " d="M545 590 V620"/></g><g id="approve"><title>Manager approval. Stay draft until approved</title><rect class="node accent" x="340" y="620" width="410" height="90" rx="10"/><text x="358" y="642" class="tag" text-anchor="start">MANAGER</text><text x="545.0" y="666" class="t" text-anchor="middle">Manager approval</text><text x="545.0" y="688" class="small" text-anchor="middle">Stay draft until approved</text></g><g id="job-create"><title>Approved only</title><path class="edge " d="M545 710 V750"/><text x="603" y="734" class="small" text-anchor="middle">Approved only</text></g><g id="job"><title>Create one shipment / job. Job and creation event saved atomically</title><rect class="node done" x="340" y="750" width="410" height="75" rx="10"/><text x="545.0" y="782" class="t" text-anchor="middle">Create one shipment / job</text><text x="545.0" y="805" class="small" text-anchor="middle">Job and creation event saved atomically</text></g><g id="execute"><title>execute</title><path class="edge " d="M545 825 V860"/></g><g id="milestones"><title>Progress operational milestones. Configured stages, owner and next action</title><rect class="node" x="340" y="860" width="410" height="90" rx="10"/><text x="358" y="882" class="tag" text-anchor="start">OPERATIONS</text><text x="545.0" y="906" class="t" text-anchor="middle">Progress operational milestones</text><text x="545.0" y="928" class="small" text-anchor="middle">Configured stages, owner and next action</text></g><g id="raise"><title>Exception raised</title><path class="edge " d="M750 898 H855"/><text x="803" y="879" class="small" text-anchor="middle">Exception raised</text></g><g id="exception"><title>Raise + assign exception. Owner · status · recovery action</title><rect class="node warn" x="855" y="839" width="340" height="100" rx="10"/><text x="1025.0" y="871" class="t" text-anchor="middle">Raise + assign exception</text><text x="1025.0" y="894" class="small" text-anchor="middle">Owner · status · recovery action</text></g><g id="recovery"><title>recovery</title><path class="edge " d="M1025 939 V971"/></g><g id="resolve"><title>Resolve and record recovery. Re-evaluate the next permitted transition</title><rect class="node done" x="855" y="971" width="340" height="76" rx="10"/><text x="1025.0" y="1003" class="t" text-anchor="middle">Resolve and record recovery</text><text x="1025.0" y="1026" class="small" text-anchor="middle">Re-evaluate the next permitted transition</text></g><g id="resume"><title>Resume workflow</title><path class="edge " d="M855 1008 H790 V927 H750"/><text x="955" y="1068" class="small" text-anchor="middle">Resume workflow</text></g><g id="ready-check"><title>ready-check</title><path class="edge " d="M545 950 V995"/></g><g id="billing-gate"><title>Evaluate billing readiness. Explicit configured / documented conditions</title><rect class="node" x="340" y="995" width="410" height="75" rx="10"/><text x="545.0" y="1027" class="t" text-anchor="middle">Evaluate billing readiness</text><text x="545.0" y="1050" class="small" text-anchor="middle">Explicit configured / documented conditions</text></g><g id="not-ready"><title>Not ready</title><path class="edge " d="M340 1032 H253 V905 H340"/><text x="252" y="982" class="small" text-anchor="middle">Not ready</text></g><g id="ready"><title>Ready</title><path class="edge " d="M545 1070 V1110"/><text x="579" y="1096" class="small" text-anchor="middle">Ready</text></g><g id="close"><title>Accounts reviews + closes job. Billing-ready state is visible before closure</title><rect class="node done" x="340" y="1110" width="410" height="90" rx="10"/><text x="358" y="1132" class="tag" text-anchor="start">ACCOUNTS</text><text x="545.0" y="1156" class="t" text-anchor="middle">Accounts reviews + closes job</text><text x="545.0" y="1178" class="small" text-anchor="middle">Billing-ready state is visible before closure</text></g><g id="audit"><title>Append-only event / audit history. </title><rect class="node accent" x="35" y="1240" width="1160" height="55" rx="10"/><text x="615.0" y="1272" class="t" text-anchor="middle">Append-only event / audit history</text></g><text x="615" y="1227" class="small" text-anchor="middle">Every material change records actor, time and what changed — including configuration and exception history.</text></g></svg>